name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web application
        working-directory: web
        run: npm run build
        env:
          # 在线图床公开上传路由 (可选，在仓库 Settings → Variables 中设置)
          # 建议指向 Worker 的 /api/public/uploads（免密，Origin 白名单校验），
          # 避免把 UPLOAD_TOKEN 打进公开产物；VITE_ 变量会进公开 JS
          VITE_IMAGE_HOST_UPLOAD_URL: ${{ vars.IMAGE_HOST_PUBLIC_UPLOAD_URL }}
          VITE_IMAGE_HOST_FILE_FIELD: ${{ vars.IMAGE_HOST_FILE_FIELD }}
          VITE_IMAGE_HOST_RESPONSE_PATH: ${{ vars.IMAGE_HOST_RESPONSE_PATH }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
